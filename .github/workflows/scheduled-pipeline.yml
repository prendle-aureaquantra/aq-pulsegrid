# Option A — trigger aq-pulsegrid-daily-global (single-task pipeline_daily on DBFS).
# Requires repo secrets: DATABRICKS_HOST, DATABRICKS_TOKEN
# Optional variable: DATABRICKS_REPO_PATH
# Deploy job locally after databricks.yml changes: python tools/deploy_databricks_job.py

name: Scheduled pipeline

on:
  schedule:
    # 06:15 UTC — after bundle job cron (06:00 UTC) or as manual cloud trigger
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      run_deploy:
        description: Run bundle deploy before job (local deploy preferred; GHA may hit Terraform checksum errors)
        type: boolean
        default: false

jobs:
  databricks-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@v0.296.0

      - name: Run aq-pulsegrid-daily-global
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_REPO_PATH: ${{ vars.DATABRICKS_REPO_PATH }}
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "Skipping: set DATABRICKS_HOST and DATABRICKS_TOKEN repo secrets to enable scheduled runs."
            exit 0
          fi
          REPO_PATH="${DATABRICKS_REPO_PATH:-/Repos/prendleman@aureaquantra.com/aq-pulsegrid}"
          export DATABRICKS_HOST DATABRICKS_TOKEN
          # Job definition is deployed from a dev machine (deploy_databricks_job.py).
          # bundle deploy on GHA can fail with Terraform openpgp checksum errors.
          if [ "${{ github.event.inputs.run_deploy }}" = "true" ]; then
            databricks bundle deploy --var="repo_path=${REPO_PATH}" || echo "WARN: bundle deploy failed; continuing with existing job"
          fi
          # Trigger job; do not fail GHA if cloud transform/export is partial (see Databricks run output).
          databricks bundle run pulsegrid_daily_global --var="repo_path=${REPO_PATH}" || {
            echo "WARN: Databricks job reported failure — check Workflows -> aq-pulsegrid-daily-global"
            echo "Primary schedule: daily 06:00 UTC on Databricks. Local/Lightsail pipeline remains authoritative for production CSVs."
            exit 0
          }
