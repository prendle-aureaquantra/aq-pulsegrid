metros:
  chicago:
    url: https://data.cityofchicago.org/resource/v6vf-nfxy.json
    date_field: created_date
    type_field: sr_type
    status_field: status
    order: created_date DESC
    limit: 150
    recent_days: 7
  nyc:
    url: https://data.cityofnewyork.us/resource/erm2-nwe9.json
    date_field: created_date
    type_field: complaint_type
    status_field: status
    select: unique_key,complaint_type,descriptor,created_date,status,borough
    order: created_date DESC
    limit: 100
    recent_days: 7
  la:
    url: https://data.lacity.org/resource/h73f-gn57.json
    date_field: createddate
    type_field: requesttype
    status_field: status
    order: createddate DESC
    limit: 150
    recent_days: 7
  san-francisco:
    url: https://data.sfgov.org/resource/wr8u-xric.json
    date_field: incident_date
    type_field: incident_category
    status_field: status
    order: incident_date DESC
    limit: 100
    recent_days: 30
  boston:
    url: https://data.boston.gov/resource/6ddrd-nqep.json
    date_field: open_dt
    type_field: type
    status_field: status
    select: case_enquiry_id,type,subject,status,open_dt
    order: open_dt DESC
    limit: 150
    recent_days: 14
  washington-dc:
    url: https://data.dc.gov/resource/wwq9-hg39.json
    date_field: servicedcdate
    type_field: servicetype
    status_field: status
    order: servicedcdate DESC
    limit: 150
    recent_days: 14
  atlanta:
    url: https://data.atlantaga.gov/resource/ss9z-mqs4.json
    date_field: date_request_submitted
    type_field: request_type
    status_field: status
    order: date_request_submitted DESC
    limit: 150
    recent_days: 14
  seattle:
    url: https://data.seattle.gov/resource/2nsb-ixfe.json
    date_field: createddate
    type_field: type
    status_field: status
    order: createddate DESC
    limit: 150
    recent_days: 14
  denver:
    url: https://data.denvergov.org/resource/dqma-36ju.json
    date_field: createddate
    type_field: issue_type
    status_field: status
    order: createddate DESC
    limit: 150
    recent_days: 14
  dallas:
    url: https://www.dallasopendata.com/resource/xvpa-j9ty.json
    date_field: created_date
    type_field: service_request_type
    status_field: status
    order: created_date DESC
    limit: 150
    recent_days: 14
  miami:
    url: https://opendata.miamidade.gov/resource/6u3d-yqwa.json
    date_field: date_created
    type_field: issue_type
    status_field: status
    order: date_created DESC
    limit: 150
    recent_days: 14
  phoenix:
    url: https://phoenixopendata.com/resource/6saz-3ayi.json
    date_field: created_at
    type_field: problem_type
    status_field: status
    order: created_at DESC
    limit: 150
    recent_days: 14
  austin:
    url: https://data.austintexas.gov/resource/n5yd-9eck.json
    date_field: created_date
    type_field: type
    status_field: status
    order: created_date DESC
    limit: 150
    recent_days: 14
  houston:
    adapter: arcgis
    url: https://mycity2.houstontx.gov/pubgis01/rest/services/311/D365_SR311_PROD/MapServer/1/query
    date_field: CreatedDate
    type_field: CaseType
    status_field: Status
    order_by: CreatedDate DESC
    where: "1=1"
    limit: 150
    recent_days: 0
  philadelphia:
    adapter: carto
    url: https://phl.carto.com/api/v2/sql
    table: public_cases_fc
    date_field: requested_datetime
    type_field: service_request_type
    status_field: status
    limit: 100
    recent_days: 14
