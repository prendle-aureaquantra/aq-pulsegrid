# /etc/nginx/sites-available/aq-pulsegrid
# Optional reverse proxy on standalone nginx (Bitnami WordPress uses Apache — see bitnami-apache-pulse-vhost.conf.example)

server {
    listen 80;
    listen [::]:80;

    server_name pulse.aureaquantra.com;

    location / {
        proxy_pass         http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
