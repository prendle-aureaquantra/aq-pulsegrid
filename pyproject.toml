[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aq-pulsegrid"
version = "0.1.0"
description = "Spark-powered urban intelligence: streaming public data, ML, PBIP generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5.0,<3.6",
    "delta-spark>=3.2.0,<3.3",
    "deltalake>=0.18.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "gtfs-realtime-bindings>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0",
    "matplotlib>=3.8.0",
]
databricks = [
    "databricks-sql-connector>=3.0.0",
]
trends = [
    "pytrends>=4.9.0",
]
copilot = [
    "openai>=1.0.0",
]
spark-gis = [
    "apache-sedona>=1.7.0",
]

[project.scripts]
pulsegrid = "pulsegrid.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pulsegrid*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"databricks/*.py" = ["F821", "E402"]
