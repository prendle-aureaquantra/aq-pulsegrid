bundle:
  name: aq-pulsegrid

# Serverless-only workspace (no classic job clusters)

variables:
  repo_path:
    description: Workspace Repos path after Git integration
    default: /Repos/prendleman@aureaquantra.com/aq-pulsegrid
  metro_tier:
    description: Metro tier filter for global job (full or weather_only)
    default: full

resources:
  jobs:
    pulsegrid_daily_global:
      name: aq-pulsegrid-daily-global
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      environments:
        - environment_key: Default
          spec:
            client: "1"
      tasks:
        # Single serverless task: shared /dbfs/tmp/aq_pulsegrid (multi-task runs lost local bronze).
        - task_key: pipeline_daily
          environment_key: Default
          notebook_task:
            notebook_path: ./databricks/pipeline_daily.py
            base_parameters:
              tier: ${var.metro_tier}
              repo_path: ${var.repo_path}

    chicago_daily:
      name: aq-pulsegrid-chicago-daily
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Chicago
        pause_status: PAUSED
      environments:
        - environment_key: Default
          spec:
            client: "1"
      tasks:
        - task_key: pulsegrid_transform_ml
          environment_key: Default
          notebook_task:
            notebook_path: ./databricks/chicago_daily.py
            base_parameters:
              city: chicago
              repo_path: ${var.repo_path}
